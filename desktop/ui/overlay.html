<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skriptly dictation</title>
  <style>
    /* Плашка диктовки: только анимация записи, без текста (текст — лишь для ошибок).
       Всегда тёмная — читается поверх любого окна. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: grid; place-items: center; font: 13px/1 "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: none; }
    /* Размеры задаём явно по состояниям — так ширина/высота анимируются
       (капсула покоя «раскрывается» в плашку записи и обратно). */
    .pill {
      position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 128px; height: 38px; padding: 0 16px; border-radius: 19px; overflow: hidden;
      background: rgba(16, 15, 12, 0.92); color: #F2EFE7;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.30), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      opacity: 0; transform: translateY(8px) scale(.94);
      transition: opacity .18s ease, transform .22s cubic-bezier(.2, .9, .3, 1.2),
        width .32s cubic-bezier(.2, .9, .3, 1.1), height .32s cubic-bezier(.2, .9, .3, 1.1),
        padding .32s ease, background .25s ease, box-shadow .25s ease;
    }
    .pill.on { opacity: 1; transform: none; }
    .pill.lock { width: 150px; }
    .pill.busy { width: 108px; }
    .pill.done { width: 52px; }
    .pill.msgw { width: auto; max-width: 452px; }
    /* Покой: тонкая капсула с белой обводкой, всегда внизу экрана */
    .pill.idle { width: 44px; height: 9px; padding: 0; border-radius: 6px; background: rgba(16, 15, 12, 0.72);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25), inset 0 0 0 1.5px rgba(242, 239, 231, 0.55); }
    .pill.idle > * { display: none !important; }
    .pill.arming .dot { background: #8C877B; animation: none; }
    .pill.out { opacity: 0; transform: translateY(4px) scale(.96); transition: opacity .25s ease, transform .25s ease; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #F0593A; flex: none; box-shadow: 0 0 0 0 rgba(240, 89, 58, .5); }
    .pill.rec .dot { animation: ping 1.6s ease-out infinite; }
    @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(240, 89, 58, .55); } 80%, 100% { box-shadow: 0 0 0 7px rgba(240, 89, 58, 0); } }
    canvas { width: 76px; height: 22px; display: block; }
    .lock { font-size: 11px; opacity: .7; }
    .check { width: 18px; height: 18px; }
    .check path { stroke: #7BC59A; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 22; stroke-dashoffset: 22; animation: draw .3s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .msg { max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(242, 239, 231, .9); }
    .msg.err::before { content: "!"; display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: 8px;
      border-radius: 50%; background: #F0593A; color: #100F0C; font-weight: 700; font-size: 11px; vertical-align: -3px; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) {
      .pill, .pill.out { transition: none; } .pill.rec .dot { animation: none; } .check path { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <span class="dot" id="dot"></span>
    <canvas id="wave" width="152" height="44"></canvas>
    <span class="lock" id="lock" hidden title="Hands-free">🔒</span>
    <svg class="check" id="check" viewBox="0 0 18 18" hidden><path d="M4 9.5l3.2 3.2L14 5.8" /></svg>
    <span class="msg" id="msg" hidden></span>
  </div>
  <script>
    const { listen } = window.__TAURI__.event;
    const $ = (id) => document.getElementById(id);
    const pill = $("pill"), canvas = $("wave"), ctx = canvas.getContext("2d");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ── Волна: 15 столбиков, амплитуда = сглаженный уровень микрофона ────
    // Атака быстрая, спад медленный — волна не дёргается. В тишине — лёгкое
    // «дыхание», чтобы было видно, что запись идёт.
    const BARS = 15;
    let target = 0, level = 0, phase = 0, mode = "idle", raf = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(76 * dpr); canvas.height = Math.round(22 * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();

    function draw() {
      raf = requestAnimationFrame(draw);
      level += (target - level) * (target > level ? 0.35 : 0.08);
      phase += mode === "busy" ? 0.12 : 0.07;
      ctx.clearRect(0, 0, 76, 22);
      ctx.fillStyle = "#F2EFE7";
      const gap = 76 / BARS;
      for (let i = 0; i < BARS; i++) {
        const x = i * gap + gap / 2;
        const center = 1 - Math.abs(i - (BARS - 1) / 2) / ((BARS - 1) / 2); // выше в середине
        let h;
        if (mode === "busy") {
          // обработка: мягкая бегущая волна одинаковой высоты
          h = 3 + 5 * (0.5 + 0.5 * Math.sin(phase * 1.6 - i * 0.55));
        } else {
          const breath = 0.5 + 0.5 * Math.sin(phase - i * 0.45);
          const voice = level * (0.55 + 0.45 * Math.sin(phase * 2.3 + i * 1.7)) * (0.35 + 0.65 * center);
          h = 2.5 + breath * 2.5 * (0.4 + 0.6 * center) + voice * 17;
        }
        h = Math.min(20, h);
        const dim = pill.classList.contains("arming") ? 0.45 : 0.92; // микрофон ещё не отдал звук
        ctx.globalAlpha = mode === "busy" ? 0.55 + 0.45 * Math.sin(phase * 1.6 - i * 0.55) ** 2 : dim;
        ctx.beginPath();
        ctx.roundRect(x - 1.25, 11 - h / 2, 2.5, h, 1.25);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    function stopWave() { cancelAnimationFrame(raf); raf = 0; }
    function startWave() {
      if (reduced) { stopWave(); level = 0.3; draw(); stopWave(); return; } // один статичный кадр
      if (!raf) draw();
    }

    function show(parts) {
      $("dot").hidden = !parts.dot;
      canvas.hidden = !parts.wave;
      $("lock").hidden = !parts.lock;
      $("check").hidden = !parts.check;
      $("msg").hidden = !parts.msg;
      if (parts.check) { const c = $("check"); c.replaceWith(c.cloneNode(true)); } // перезапуск анимации галочки
    }

    let handsfree = false, outTimer = 0;
    function reveal() {
      clearTimeout(outTimer);
      pill.classList.remove("out");
      pill.classList.add("on");
    }

    const SHAPES = ["idle", "rec", "arming", "lock", "busy", "done", "msgw"];
    function shape(...cls) {
      pill.classList.remove(...SHAPES);
      pill.classList.add(...cls);
    }

    function reset() {
      pill.classList.remove("on", "out", ...SHAPES); stopWave(); handsfree = false; level = target = 0;
    }

    listen("overlay", ({ payload: p }) => {
      if (p.state === "hidden") { reset(); return; } // окно прячет Rust — не крутим анимацию впустую
      reveal();
      switch (p.state) {
        case "idle":
          stopWave(); handsfree = false; level = target = 0;
          shape("idle");
          break;
        case "arming":
        case "listening":
        case "handsfree":
          if (p.state === "handsfree") handsfree = true;
          mode = "rec";
          shape("rec", ...(p.state === "arming" ? ["arming"] : []), ...(handsfree ? ["lock"] : []));
          show({ dot: true, wave: true, lock: handsfree });
          startWave();
          break;
        case "finishing":
        case "polishing":
          mode = "busy"; target = 0;
          shape("busy");
          show({ wave: true, lock: false });
          startWave();
          break;
        case "done":
          handsfree = false; stopWave();
          shape("done");
          show({ check: true });
          break;
        case "empty":
        case "error":
          handsfree = false; stopWave();
          shape("msgw");
          $("msg").textContent = p.text || (p.state === "empty" ? "Didn't catch that" : "Something went wrong");
          $("msg").className = "msg" + (p.state === "error" ? " err" : "");
          show({ msg: true });
          break;
      }
    });

    listen("overlay-level", ({ payload: v }) => {
      target = Math.min(1, Math.sqrt(v) * 2.4); // RMS речи 0.02–0.3 → 0.35–1
    });

    matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener?.("change", resize);
  </script>
</body>
</html>
