<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Skriptly</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #F6F4EE; color: #14120E;
           font: 15px "Segoe UI", system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #100F0C; color: #F2EFE7; } .sub { color: #A29B8B; } }
    .box { text-align: center; }
    .mark { width: 44px; height: 44px; border-radius: 12px; background: #14120E; color: #F6F4EE; margin: 0 auto 18px;
            display: grid; place-items: center; font: 700 24px "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) { .mark { background: #F2EFE7; color: #100F0C; } }
    .sub { color: #6B6557; margin: 0 0 16px; }
    button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 1px solid #D8D2C1;
             background: transparent; color: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">S</div>
    <p class="sub" id="msg">Loading Skriptly…</p>
    <button id="retry" hidden>Try again</button>
  </div>
  <script>
    // Главное окно — это веб-приложение. Эта страница только проверяет связь и переходит;
    // без интернета показывает «Try again» (а диктовка из трея всё равно работает).
    const msg = document.getElementById("msg"), retry = document.getElementById("retry");
    let timer = 0;
    async function go() {
      clearTimeout(timer);
      retry.hidden = true;
      msg.textContent = "Loading Skriptly…";
      try {
        const url = await window.__TAURI__.core.invoke("app_url");
        await fetch(url, { mode: "no-cors", cache: "no-store" });
        location.replace(url);
      } catch (e) {
        msg.textContent = "Can't reach Skriptly. Check your internet connection.";
        retry.hidden = false;
        timer = setTimeout(go, 8000);
      }
    }
    retry.onclick = go;
    go();
  </script>
</body>
</html>
