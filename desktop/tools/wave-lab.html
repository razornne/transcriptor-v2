<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skriptly · wave lab</title>
<style>
  /* Лаборатория волны диктовки: тот же вид капсулы, что в desktop/ui/overlay.html, но с живым
     микрофоном (или имитацией речи), тремя вариантами рисунка и ползунками. Открыть в Chrome
     (file://) и разрешить микрофон. Подобранные значения → в overlay.html. */
  :root { --ink:#14120E; --paper:#F6F4EE; --signal:#F0593A; --mute:rgba(246,244,238,.62); --line:rgba(246,244,238,.16); }
  * { box-sizing: border-box; }
  body { margin:0; background:#17171a; color:#ddd8cc; font:14px/1.4 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; } .sub { color:#8d887b; margin:0 0 20px; font-size:13px; }
  .stage { border-radius: 14px; background:#101012; padding: 34px 0 22px; display:flex; flex-direction:column; align-items:center; gap:26px; border:1px solid #26262b; }
  .row { display:flex; align-items:center; gap:18px; }
  .tag { font:600 11px/1 ui-monospace,Consolas,monospace; color:#8d887b; letter-spacing:.06em; text-transform:uppercase; width:96px; text-align:right; }
  .pill { display:flex; align-items:center; gap:10px; height:38px; padding:0 16px; border-radius:19px; background:rgba(20,18,14,.96);
    box-shadow:0 8px 24px rgba(0,0,0,.4), inset 0 0 0 1px var(--line); color:var(--paper); }
  .pill .dot { width:7px; height:7px; border-radius:50%; background:var(--signal); animation:ping 1.6s ease-out infinite; flex:none; }
  @keyframes ping { 0%{box-shadow:0 0 0 0 rgba(240,89,58,.55)} 80%,100%{box-shadow:0 0 0 7px rgba(240,89,58,0)} }
  .pill .lang { font:600 11px/1 ui-monospace,Consolas,monospace; letter-spacing:.06em; color:var(--mute); }
  .pill .sep { width:1px; height:14px; background:var(--line); }
  .pill svg { width:12px; height:12px; stroke:var(--mute); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  canvas { display:block; }
  .panel { margin-top:18px; display:grid; grid-template-columns: 1fr 1fr; gap:14px 28px; background:#1d1d21; border:1px solid #2a2a30; border-radius:14px; padding:18px 20px; }
  .panel h2 { grid-column:1/-1; font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:#8d887b; margin:0; }
  label { display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:#b9b4a6; }
  label span b { float:right; font-weight:500; color:#ddd8cc; font-family:ui-monospace,Consolas,monospace; }
  input[type=range] { width:100%; accent-color:#F0593A; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { background:#26262b; color:#ddd8cc; border:1px solid #33333a; border-radius:8px; padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .seg button.on { background:#F6F4EE; color:#14120E; border-color:#F6F4EE; }
  .full { grid-column:1/-1; }
  .meter { height:8px; border-radius:4px; background:#26262b; overflow:hidden; } .meter i { display:block; height:100%; width:0; background:#F6F4EE; }
  .note { font-size:12.5px; color:#8d887b; grid-column:1/-1; margin:0; }
  .msg { color:#F0593A; font-size:12.5px; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Wave lab</h1>
  <p class="sub">Живая волна для плашки диктовки. Выберите источник, вариант рисунка, покрутите ползунки и говорите. Нижний ряд — тот же вид в реальном размере.</p>

  <div class="stage">
    <div class="row"><span class="tag">×3</span><div class="pill" id="pillBig"><span class="dot"></span><span class="lang">AUTO</span><span class="sep"></span><canvas id="cBig"></canvas><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div></div>
    <div class="row"><span class="tag">1:1</span><div class="pill" id="pillSmall"><span class="dot"></span><span class="lang">AUTO</span><span class="sep"></span><canvas id="cSmall"></canvas><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div></div>
  </div>

  <div class="panel">
    <h2>Источник и рисунок</h2>
    <div class="full"><div class="seg" id="srcSeg"><button data-v="mic" class="on">Микрофон</button><button data-v="sim">Имитация речи</button></div><div class="msg" id="msg"></div></div>
    <div class="full"><div class="seg" id="varSeg">
      <button data-v="spectrum" class="on">A · Спектр</button>
      <button data-v="scroll">B · Лента времени</button>
      <button data-v="mirror">C · Густой растр</button>
    </div></div>
    <p class="note" id="varNote"></p>

    <h2>Чувствительность</h2>
    <label class="full"><div class="meter"><i id="lvl"></i></div><span>уровень сейчас <b id="lvlv">–</b></span></label>
    <label><span>Усиление (авто-подстройка под ваш микрофон) <b id="gv"></b></span><input id="gain" type="range" min="0" max="100" value="60"></label>
    <label><span>Порог тишины <b id="tv"></b></span><input id="gate" type="range" min="0" max="100" value="22"></label>
    <label><span>Отклик (быстро ↔ плавно) <b id="rv"></b></span><input id="rel" type="range" min="0" max="100" value="45"></label>
    <label><span>Ширина волны <b id="wv"></b></span><input id="wid" type="range" min="56" max="140" value="84"></label>
    <label><span>Размер точек <b id="dv"></b></span><input id="dsz" type="range" min="60" max="140" value="100"></label>
    <label><span>Рядов точек <b id="rowv"></b></span><input id="rows" type="range" min="3" max="9" step="2" value="5"></label>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const P = { src: "mic", variant: "spectrum" };
const NOTES = {
  spectrum: "Каждый столбец — своя частота (низкий голос слева, шипящие справа). Говорите «а-а-а» и «с-с-с» — картинка разная. Столбец растёт от центра, точки крупнеют как растр.",
  scroll: "Лента: новые значения громкости появляются справа и едут влево, как в голосовых заметках. В тишине лента стоит.",
  mirror: "Густой вариант: больше столбцов и мелкие точки, ближе к «аудиоспектру».",
};

// ── Вход: микрофон или имитация ─────────────────────────────────────────
const NB = 24;                       // частотных полос на входе (из них берём нужное число столбцов)
const FMIN = 90, FMAX = 6500;
let actx, analyser, fbuf, binEdges = [];
let simT = 0, simEnv = 0, simNext = 0, simF = 6;

async function startMic() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const src = actx.createMediaStreamSource(stream);
    analyser = actx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0;
    src.connect(analyser);
    fbuf = new Float32Array(analyser.frequencyBinCount);
    const hz = actx.sampleRate / analyser.fftSize;
    binEdges = [];
    for (let i = 0; i <= NB; i++) binEdges.push(Math.min(analyser.frequencyBinCount - 1, Math.round(FMIN * Math.pow(FMAX / FMIN, i / NB) / hz)));
    $("msg").textContent = "";
    return true;
  } catch (e) {
    $("msg").textContent = "Нет доступа к микрофону (" + (e.name || e) + "). Включена имитация речи.";
    return false;
  }
}

// Имитация речи: слоги ~4–6 Гц, внутри фразы — формантные пики, между фразами — тишина.
function simBands(dt) {
  simT += dt;
  if (simT > simNext) { simNext = simT + (Math.random() < .5 ? .5 + Math.random() * 1.4 : .35 + Math.random() * 1.2); simEnv = simEnv > .5 ? 0 : 1; simF = 4 + Math.random() * 4; }
  const syl = simEnv ? (0.35 + 0.65 * Math.pow(Math.abs(Math.sin(simT * simF)), .8)) : 0;
  const out = new Float32Array(NB);
  const f1 = 3 + 3 * (0.5 + 0.5 * Math.sin(simT * 1.7)), f2 = 10 + 5 * (0.5 + 0.5 * Math.sin(simT * 0.9 + 1));
  for (let i = 0; i < NB; i++) {
    const shape = Math.exp(-Math.pow((i - f1) / 2.4, 2)) + 0.75 * Math.exp(-Math.pow((i - f2) / 3, 2)) + 0.25 * Math.exp(-i / 14);
    out[i] = -78 + syl * (32 * Math.min(1, shape) + 6) + Math.random() * 2;
  }
  return out;
}
function micBands() {
  analyser.getFloatFrequencyData(fbuf);
  const out = new Float32Array(NB);
  for (let b = 0; b < NB; b++) {
    let s = 0, n = 0;
    for (let k = binEdges[b]; k <= Math.max(binEdges[b], binEdges[b + 1] - 1); k++) { s += Math.pow(10, fbuf[k] / 20); n++; }
    out[b] = 20 * Math.log10(Math.max(1e-9, s / Math.max(1, n)));
  }
  return out;
}

// ── Нормализация (авто-усиление) ────────────────────────────────────────
// Фон (floor) — медленно подстраивается под тишину; потолок (ceil) — под самую громкую речь.
// Так тихий ноутбучный микрофон и громкая гарнитура рисуют одинаково «полную» волну.
const floorB = new Float32Array(NB), smB = new Float32Array(NB);
let floorInit = false, ceilEx = 30, streak = 0, lastActive = -10, clock = 0;
let floorDb = -80, ceilDb = -45; // для подписи
// Тот же алгоритм, что в desktop/ui/overlay.html: пол по каждой полосе + детектор голоса.
function normalize(bandsDb, dt) {
  clock += dt;
  if (!floorInit) { for (let i = 0; i < NB; i++) smB[i] = floorB[i] = bandsDb[i]; floorInit = true; }
  let peak = 0, meanF = 0;
  const ex = new Float32Array(NB);
  for (let i = 0; i < NB; i++) {
    smB[i] += (bandsDb[i] - smB[i]) * 0.5;
    floorB[i] += (smB[i] - floorB[i]) * Math.min(1, dt * (smB[i] < floorB[i] ? 3 : 0.01));
    ex[i] = Math.max(0, smB[i] - floorB[i]) * (1 + 0.5 * i / NB);
    peak = Math.max(peak, ex[i]); meanF += floorB[i];
  }
  ceilEx = peak > ceilEx ? peak : Math.max(22, ceilEx - 2.5 * dt);
  floorDb = meanF / NB; ceilDb = floorDb + ceilEx;
  const gainSlider = +$("gain").value / 100;
  const span = Math.max(14, ceilEx * (1.15 - 0.5 * gainSlider));
  const gate = 6 + (+$("gate").value / 100) * 14;
  let above = 0;
  for (let i = 0; i < NB; i++) if (ex[i] > gate) above++;
  streak = above >= 4 ? streak + 1 : 0;
  if (streak >= 2) lastActive = clock;
  const speaking = clock - lastActive < 0.25;
  const out = new Float32Array(NB);
  let voiced = 0;
  for (let i = 0; i < NB; i++) { out[i] = speaking ? Math.pow(Math.max(0, Math.min(1, (ex[i] - gate) / span)), 1.3) : 0; voiced = Math.max(voiced, out[i]); }
  return { bands: out, voiced };
}

// ── Рисунок ─────────────────────────────────────────────────────────────
const views = [
  { canvas: $("cBig"), zoom: 3 },
  { canvas: $("cSmall"), zoom: 1 },
];
let state = { cols: 16, vals: new Float32Array(NB), peaks: new Float32Array(NB), hist: [] };
function layout() {
  const W = +$("wid").value, ROWS = +$("rows").value;
  const cols = P.variant === "mirror" ? Math.round(W / 3.6) : P.variant === "scroll" ? Math.round(W / 5) : Math.round(W / 5.2);
  const px = W / cols, py = P.variant === "mirror" ? 3.4 : 4.4;
  const H = Math.max(22, Math.ceil(py * ROWS + 4));
  return { W, H, cols, px, py, rows: ROWS };
}
function setupCanvas() {
  const L = layout();
  for (const v of views) {
    const dpr = window.devicePixelRatio || 1, k = dpr * v.zoom;
    v.canvas.width = Math.round(L.W * k); v.canvas.height = Math.round(L.H * k);
    v.canvas.style.width = L.W * v.zoom + "px"; v.canvas.style.height = L.H * v.zoom + "px";
    v.k = k;
  }
  document.querySelectorAll(".pill").forEach((p) => { p.style.zoom = ""; });
  $("pillBig").style.transform = "scale(1)";
}

const lerp = (a, b, t) => a + (b - a) * t;
function frame(now, dt, L, norm) {
  const relSlider = +$("rel").value / 100;               // 0 быстро … 1 плавно
  const attack = lerp(0.85, 0.45, relSlider), release = lerp(0.35, 0.06, relSlider);
  const size = +$("dsz").value / 100;
  const mid = (L.rows - 1) / 2;

  // столбцы из полос
  const cols = L.cols, target = new Float32Array(cols);
  if (P.variant === "scroll") {
    // громкость = среднее по верхним полосам; новый столбец раз в ~45 мс, лента идёт только при голосе
    state.scrollAcc = (state.scrollAcc || 0) + dt;
    const lvl = Math.min(1, norm.voiced * 1.05);
    state.lastVoiced = lvl > 0.04 ? now : (state.lastVoiced || 0);
    if (now - state.lastVoiced < 700 && state.scrollAcc > 0.045) { state.scrollAcc = 0; state.hist.push(lvl); }
    while (state.hist.length > cols) state.hist.shift();
    while (state.hist.length < cols) state.hist.unshift(0);
    for (let i = 0; i < cols; i++) target[i] = state.hist[i];
    state.vals = state.vals.length === cols ? state.vals : new Float32Array(cols);
    for (let i = 0; i < cols; i++) state.vals[i] = target[i];
  } else {
    // частоты → столбцы (центр голоса — в середине: низкие и высокие к краям делит симметрия)
    for (let i = 0; i < cols; i++) {
      const bi = Math.min(NB - 1, Math.floor((i / cols) * NB));
      // слегка усредняем соседей
      target[i] = (norm.bands[bi] * 2 + norm.bands[Math.max(0, bi - 1)] + norm.bands[Math.min(NB - 1, bi + 1)]) / 4;
    }
    if (state.vals.length !== cols) { state.vals = new Float32Array(cols); state.peaks = new Float32Array(cols); }
    for (let i = 0; i < cols; i++) {
      const t = target[i], c = state.vals[i];
      state.vals[i] = t > c ? lerp(c, t, attack) : lerp(c, t, release);
      state.peaks[i] = Math.max(state.vals[i], state.peaks[i] - dt * 0.55); // «след» — плавно оседает
    }
  }
  for (const v of views) {
    const ctx = v.canvas.getContext("2d");
    ctx.setTransform(v.k, 0, 0, v.k, 0, 0);
    ctx.clearRect(0, 0, L.W, L.H);
    ctx.fillStyle = "#F6F4EE";
    for (let i = 0; i < cols; i++) {
      const x = L.px / 2 + i * L.px;
      const val = state.vals[i];
      const peak = P.variant === "scroll" ? val : state.peaks[i];
      for (let r = 0; r < L.rows; r++) {
        const d = Math.abs(r - mid) / Math.max(1, mid);          // 0 в центре … 1 на краю
        const k = Math.max(0, Math.min(1, (val * 1.15 - d * 0.82) / 0.5));
        const trail = P.variant === "scroll" ? 0 : Math.max(0, Math.min(1, (peak * 1.15 - d * 0.82) / 0.5)) * 0.35;
        const base = r === mid ? 1 : 0;
        if (!base && k < 0.03 && trail < 0.03) continue;
        const rad = (0.7 * size) + k * (1.4 * size) * (1 - 0.15 * d) + (r === mid ? 0.15 : 0);
        ctx.globalAlpha = Math.min(1, 0.4 + 0.6 * k + trail);
        ctx.beginPath(); ctx.arc(x, L.H / 2 + (r - mid) * L.py, P.variant === "mirror" ? rad * 0.78 : rad, 0, 6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
}

// ── Цикл ────────────────────────────────────────────────────────────────
let last = performance.now(), L = layout();
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const bands = P.src === "mic" && analyser ? micBands() : simBands(dt);
  const norm = normalize(bands, dt);
  $("lvl").style.width = Math.round(norm.voiced * 100) + "%";
  $("lvlv").textContent = `${(floorDb).toFixed(0)} дБ фон · ${(ceilDb).toFixed(0)} дБ потолок`;
  frame(now / 1000, dt, L, norm);
  requestAnimationFrame(loop);
}

function relabel() {
  $("gv").textContent = $("gain").value + "%"; $("tv").textContent = $("gate").value + "%";
  $("rv").textContent = $("rel").value + "%"; $("wv").textContent = $("wid").value + " px";
  $("dv").textContent = $("dsz").value + "%"; $("rowv").textContent = $("rows").value;
  $("varNote").textContent = NOTES[P.variant];
}
function relayout() { L = layout(); state.vals = new Float32Array(L.cols); state.peaks = new Float32Array(L.cols); state.hist = []; setupCanvas(); relabel(); }
["gain", "gate", "rel", "wid", "dsz", "rows"].forEach((id) => $(id).addEventListener("input", () => (id === "wid" || id === "rows") ? relayout() : relabel()));
$("varSeg").addEventListener("click", (e) => { const v = e.target.dataset.v; if (!v) return; P.variant = v; [...$("varSeg").children].forEach((b) => b.classList.toggle("on", b.dataset.v === v)); relayout(); });
$("srcSeg").addEventListener("click", async (e) => {
  const v = e.target.dataset.v; if (!v) return;
  P.src = v; [...$("srcSeg").children].forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  if (v === "mic" && !analyser) { if (!(await startMic())) { P.src = "sim"; [...$("srcSeg").children].forEach((b) => b.classList.toggle("on", b.dataset.v === "sim")); } }
});
relayout();
startMic().then((ok) => { if (!ok) { P.src = "sim"; [...$("srcSeg").children].forEach((b) => b.classList.toggle("on", b.dataset.v === "sim")); } });
requestAnimationFrame(loop);
</script>
</body>
</html>
